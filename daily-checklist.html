<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Operations Checklist | Lyra Residency</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe3; --card:#fffaf1; --brown:#4a3222; --brown-2:#6b4a33;
  --gold:#b8913f; --gold-soft:#e9dcbc; --line:#e3d6bb; --ok:#4f7a4a; --muted:#7a6551; --bad:#a63d2f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--brown);line-height:1.55;padding-bottom:40px}
header{background:var(--brown);color:#f6efe3;text-align:center;padding:34px 18px 28px;border-bottom:4px solid var(--gold)}
header .brand{font-family:'Cormorant Garamond',serif;font-size:2.1rem;letter-spacing:.18em;font-weight:700;color:var(--gold-soft)}
header h1{font-weight:300;font-size:1rem;letter-spacing:.3em;text-transform:uppercase;margin-top:4px}
header .date{margin-top:12px;font-size:.9rem;color:#d9c9a6}
main{max-width:760px;margin:0 auto;padding:22px 16px}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
.bar-wrap{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;background:var(--gold-soft);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .3s}
.pct{font-weight:600;font-size:.9rem;min-width:72px;text-align:right}
.staff{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;display:flex;gap:10px;align-items:center}
.staff label{font-weight:500;white-space:nowrap}
input[type=text],input[type=number],input[type=time]{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--brown)}
input:focus{outline:3px solid var(--gold-soft);border-color:var(--gold)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:18px;box-shadow:0 2px 10px rgba(74,50,34,.06)}
section h2{font-family:'Cormorant Garamond',serif;font-size:1.55rem;display:flex;align-items:center;gap:10px}
section h2 .n{background:var(--gold);color:#fff;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;font-family:'Jost',sans-serif;font-weight:600;flex:none}
.time{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500;margin:4px 0 10px 42px}
.intro{color:var(--muted);margin:8px 0 10px}
ul{list-style:none}
li{border-top:1px dashed var(--line);padding:14px 4px}
li:first-child{border-top:0}
.th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.th b{font-weight:600}
.cnt{font-size:.85rem;color:var(--ok);font-weight:600;white-space:nowrap}
.d{color:var(--muted);font-size:.95rem;margin:2px 0 8px}
.d.warn{color:var(--bad);font-weight:500}
.f{margin-top:10px}
.fl{font-size:.85rem;font-weight:500;color:var(--brown-2);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;padding:9px 14px;border:1.5px solid var(--gold);border-radius:99px;background:#fff;color:var(--brown);cursor:pointer}
.chip.on{background:var(--brown);color:#f6efe3;border-color:var(--brown)}
.chip.on.bad{background:var(--bad);border-color:var(--bad)}
.save{margin-top:14px;font:inherit;font-weight:500;background:var(--brown);color:#f6efe3;border:2px solid var(--brown);border-radius:10px;padding:11px 22px;cursor:pointer}
.save:disabled{opacity:.6}
.msg{font-size:.9rem;margin-top:8px;min-height:1em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
li.done .th b{color:var(--ok)}
.btn{display:inline-block;margin-top:14px;background:var(--brown);color:#f6efe3;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:500;border:2px solid var(--brown)}
.btn.alt{background:transparent;color:var(--brown);cursor:pointer;font-family:inherit;font-size:1rem}
.all-done{display:none;text-align:center;margin-top:18px;background:#e6f0e2;color:#2f5a2b;border:1px solid #b9d3b3;padding:14px;border-radius:12px;font-weight:500}
.actions{margin-top:22px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:26px}
footer a{color:var(--brown-2)}
@media print{.progress,.actions{display:none}body{background:#fff}section{box-shadow:none}}
</style>
</head>
<body>

<header>
  <div class="brand">LYRA RESIDENCY</div>
  <h1>Daily Operations Checklist</h1>
  <div class="date" id="today"></div>
</header>

<main>
  <div class="progress">
    <div class="bar-wrap">
      <div class="bar"><span id="barFill"></span></div>
      <div class="pct" id="pct">0 / 0</div>
    </div>
    <div class="staff"><label for="staff">Your name</label><input type="text" id="staff" placeholder="Staff name" autocomplete="name"></div>
  </div>

  <div id="root"></div>

  <div class="all-done" id="allDone">✔ All tasks completed for today. Great work!</div>

  <div class="actions">
    <a class="btn" id="sheetLink" href="#" target="_blank" rel="noopener" style="display:none">Open Daily Log Sheet →</a>
    <button class="btn alt" id="reset" type="button">Reset ticks on this phone</button>
  </div>

  <footer>Lyra Residency · Internal staff use · <a href="/">Back to website</a></footer>
</main>

<script>
(function(){
  /* ====== SETTINGS ====== */
  var API   = 'https://script.google.com/macros/s/AKfycbyD3FKz5l71YNVcPPjvaZngtfaf9S7Et0Cdoirwegz_5jt3pV2v14K9pKuuQNgNWqjFhw/exec';   // Web app URL from the Apps Script deployment
  var TOKEN = 'Karthindhu@2015';              // must match TOKEN in Code.gs
  var SHEET_URL = '';                         // optional: your Google Sheet link for the owner button
  /* ======================= */

  var Y='Yes', N='No';
  var SECTIONS = [
    {n:'Morning Operations', t:'6:00 AM – 8:00 AM'},
    {n:'Evening Reading', t:'6:00 PM'}
  ];
  /* field: l=label, t=choice|number|text|time, o=options, r=required, bad=option that shows red (and raises an alert in the sheet) */
  var TASKS = [
    {s:0,id:'leaks',title:'Bathroom leak inspection',d:'Observe carefully for any leaking in every bathroom – especially the health faucet, spray guns and hoses, and the heater faucet.',warn:'Do not waste water in the name of testing. Check by careful observation only.',f:[
      {l:'Any leaks?',t:'choice',o:['No leaks','Leak found'],bad:'Leak found',r:1},
      {l:'Where / notes',t:'text'}]},
    {s:0,id:'heatpump',title:'Heat pump',d:'Ensure the heat pump is ON and has not tripped.',f:[
      {l:'Status',t:'choice',o:['ON – not tripped','Tripped / OFF'],bad:'Tripped / OFF',r:1}]},
    {s:0,id:'tank',title:'Automatic water alarm',d:'Check that the automatic water alarm is working and its sound is coming properly.',f:[
      {l:'Automatic water alarm working?',t:'choice',o:[Y,N],bad:N,r:1},
      {l:'Alarm sound coming properly?',t:'choice',o:[Y,N],bad:N,r:1}]},
    {s:0,id:'soakpit',title:'Soakpit',d:'Check the soakpit water level and empty if required.',f:[
      {l:'Water level',t:'choice',o:['Low','Half','High','Full'],bad:'Full',r:1},
      {l:'Emptied?',t:'choice',o:['Emptied','Not needed'],r:1}]},
    {s:0,id:'dwater',title:'Drinking water can',d:'Check the drinking water can is available.',f:[
      {l:'Status',t:'choice',o:['Available','Needs refill','Ordered'],bad:'Needs refill',r:1},
      {l:'Notes',t:'text'}]},
    {s:0,id:'laundry',title:'Laundry follow-up',d:'Follow up on linen sent for laundry.',f:[
      {l:'Status',t:'choice',o:['Nothing pending','Sent','Received back','Delayed'],bad:'Delayed',r:1},
      {l:'Notes',t:'text'}]},

    {s:1,id:'eb',title:'EB reading – units',d:'Update daily at 6 PM.',f:[
      {l:'Meter reading (units)',t:'number',r:1}]}
  ];

  /* ---------- helpers ---------- */
  function pad(n){return (n<10?'0':'')+n}
  function localDate(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
  var DATE = localDate(), KEY='lyra-ops-'+DATE;
  var saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
  var staffEl=document.getElementById('staff');
  try{staffEl.value=localStorage.getItem('lyra-staff')||''}catch(e){}
  staffEl.addEventListener('input',function(){try{localStorage.setItem('lyra-staff',staffEl.value)}catch(e){}});
  document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(SHEET_URL){var sl=document.getElementById('sheetLink');sl.href=SHEET_URL;sl.style.display='inline-block'}

  /* ---------- render ---------- */
  var root=document.getElementById('root');
  SECTIONS.forEach(function(S,si){
    var sec=document.createElement('section');
    var h='<h2><span class="n">'+(si+1)+'</span> '+S.n.replace('&','&amp;')+'</h2>'+(S.t?'<div class="time">'+S.t+'</div>':'')+(S.i?'<p class="intro">'+S.i+'</p>':'')+'<ul></ul>';
    sec.innerHTML=h; var ul=sec.querySelector('ul');
    TASKS.forEach(function(T,ti){
      if(T.s!==si)return;
      var li=document.createElement('li'); li.dataset.i=ti; li.id='t-'+T.id;
      var fh='';
      T.f.forEach(function(F,fi){
        fh+='<div class="f" data-fi="'+fi+'"><div class="fl">'+F.l+(F.r?' *':'')+'</div>';
        if(F.t==='choice') fh+='<div class="chips">'+F.o.map(function(o){return '<button type="button" class="chip'+(o===F.bad?' isbad':'')+'" data-v="'+o+'">'+o+'</button>'}).join('')+'</div>';
        else fh+='<input type="'+(F.t==='number'?'number':F.t==='time'?'time':'text')+'"'+(F.t==='number'?' inputmode="decimal" step="any"':'')+'>';
        fh+='</div>';
      });
      li.innerHTML='<div class="th"><b>'+T.title+'</b><span class="cnt"></span></div><p class="d">'+T.d+'</p>'+(T.warn?'<p class="d warn">⚠ '+T.warn+'</p>':'')+fh+'<button type="button" class="save">Save</button><div class="msg"></div>';
      resetForm(li,T);
      ul.appendChild(li);
    });
    root.appendChild(sec);
  });

  function resetForm(li,T){
    Array.prototype.forEach.call(li.querySelectorAll('.f'),function(fd){
      var F=T.f[fd.dataset.fi];
      Array.prototype.forEach.call(fd.querySelectorAll('.chip'),function(c){c.classList.remove('on','bad')});
      var inp=fd.querySelector('input'); if(inp) inp.value=(F.t==='time'?nowHM():'');
    });
  }

  /* ---------- events ---------- */
  root.addEventListener('click',function(e){
    var li=e.target.closest('li'); if(!li)return;
    var T=TASKS[li.dataset.i];
    if(e.target.classList.contains('chip')){
      var chips=e.target.parentNode.children;
      Array.prototype.forEach.call(chips,function(c){c.classList.remove('on','bad')});
      e.target.classList.add('on'); if(e.target.classList.contains('isbad')) e.target.classList.add('bad');
    }else if(e.target.classList.contains('save')){
      save(li,T);
    }
  });

  /* ---------- save ---------- */
  function save(li,T){
    var msg=li.querySelector('.msg'),btn=li.querySelector('.save');
    function fail(t){msg.className='msg err';msg.textContent=t}
    if(!staffEl.value.trim()){staffEl.focus();return fail('Please enter your name at the top first.')}
    var parts=[],missing=null,flag=false;
    Array.prototype.forEach.call(li.querySelectorAll('.f'),function(fd){
      var F=T.f[fd.dataset.fi],v='';
      if(F.t==='choice'){
        var on=fd.querySelector('.chip.on');
        v=on?on.dataset.v:'';
        if(on&&on.classList.contains('isbad'))flag=true;
      }else v=fd.querySelector('input').value.trim();
      if(F.r&&!v&&!missing)missing=F.l;
      if(v)parts.push(F.l+': '+v);
    });
    if(missing)return fail('Please fill: '+missing);
    if(API.indexOf('PASTE_')===0)return fail('Page not connected yet – add the Apps Script URL in the settings.');
    btn.disabled=true;btn.textContent='Saving…';msg.className='msg';msg.textContent='';
    var payload={token:TOKEN,date:DATE,staff:staffEl.value.trim(),section:SECTIONS[T.s].n,taskId:T.id,task:T.title,summary:parts.join(' | '),flag:flag};
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(function(r){return r.json()})
      .then(function(j){
        if(!j.ok)throw new Error(j.error||'Save failed');
        saved[T.id]=(saved[T.id]||0)+1;store();
        msg.className='msg ok';msg.textContent='✔ Saved at '+nowHM();
        if(T.rep)resetForm(li,T);
      })
      .catch(function(err){fail('Not saved – check internet and try again. ('+err.message+')')})
      .then(function(){btn.disabled=false;update()});
  }

  /* ---------- progress ---------- */
  function update(){
    var done=0;
    TASKS.forEach(function(T){
      var li=document.getElementById('t-'+T.id),n=saved[T.id]||0;
      if(n>0)done++;
      li.classList.toggle('done',n>0);
      li.querySelector('.cnt').textContent=n>0?'✔ '+(T.rep?n+' saved':'Saved'):'';
      li.querySelector('.save').textContent=n>0&&!T.rep?'Save again':(T.rep&&n>0?'Save another':'Save');
    });
    document.getElementById('pct').textContent=done+' / '+TASKS.length;
    document.getElementById('barFill').style.width=(done/TASKS.length*100)+'%';
    document.getElementById('allDone').style.display=done===TASKS.length?'block':'none';
  }

  document.getElementById('reset').addEventListener('click',function(){
    if(confirm('Clear all ticks on this phone for today? Data already saved to the Sheet stays there.')){saved={};store();update()}
  });
  update();
})();
</script>
</body>
</html>
